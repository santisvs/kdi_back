[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kdi-back"
version = "0.1.0"
description = "Sistema de recomendaciones de golf con agentes IA"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "KDI Team"}
]
keywords = ["golf", "ai", "agents", "flask", "postgis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "flask>=2.3.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "strands-agents",
    "strands-agents-tools",
    "strands-agents-builder",
    "boto3>=1.28.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "cryptography>=41.0.0",
    "langchain>=1.2.3",
    "langchain-aws>=1.2.0",
    "langchain-core>=1.2.7",
    "langchain-openai>=1.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "awsebcli>=3.25.0",  # AWS Elastic Beanstalk CLI para despliegue
]

[project.scripts]
kdi-back = "kdi_back.api.main:create_app"

[tool.setuptools]
packages = ["kdi_back"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "awsebcli>=3.25.3",
]

